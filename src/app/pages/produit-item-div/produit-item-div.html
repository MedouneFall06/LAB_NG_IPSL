<li class="produit-item">
  <div class="produit-item-column id">{{ produit?.id }}</div>

  <!-- Le nom devient cliquable -->
  <div class="produit-item-column name">
    <a [routerLink]="['/produits/detail', produit?.id]"
       class="product-name-link"
       [title]="'Voir les détails de ' + (produit?.nom || '')">
      {{ produit?.nom }}
    </a>
  </div>

  <div class="produit-item-column price">{{ produit?.prix }} €</div>
  <div class="produit-item-column stock">
    <span class="badge">{{ produit?.quantite }} en stock</span>
  </div>
  <div class="produit-item-column actions">
    <button class="btn-edit" [routerLink]="['/produits/modifier', produit?.id]">
      Modifier
    </button>
    <button class="btn-delete" (click)="onDelete()">
      Supprimer
    </button>
  </div>
</li>
