<!-- Bloc user avec le nom dynamique -->
<div class="user-header">
  <div class="user-info">
    Connecté en tant que : <strong>{{ username || 'Utilisateur' }}</strong>
  </div>
</div>

<!-- La navbar avec son propre bouton -->
<app-navbar
  [username]="username"
  [searchTerm]="searchTerm"
  (search)="onSearch($event)"
  (logout)="logout()">
</app-navbar>

<div class="container">
  <!-- En-tête du tableau -->
  <div class="table-header">
    <div class="column-header id">ID</div>
    <div class="column-header name">Nom du Produit</div>
    <div class="column-header price">Prix</div>
    <div class="column-header stock">Quantité</div>
    <div class="column-header actions">Actions</div>
  </div>

  <!-- Liste des produits -->
  <ul class="liste">
    @for (produit of produits; track produit.id) {
      <app-produit-item-div
        [produit]="produit"
        (delete)="deleteProduit($event)">
      </app-produit-item-div>
    }
  </ul>

  <footer class="footer">By Baye Medoune © 2026</footer>
</div>
